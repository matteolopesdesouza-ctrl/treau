name: Import TREAU website source
on:
  push:
    branches: [main]
    paths:
      - 'TREAU-source.zip'
      - '.github/workflows/import-treau.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract complete TREAU source and publish to main
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TREAU-source.zip ]; then
            echo 'The website source is already imported.'
            exit 0
          fi
          mkdir -p .treau-import
          unzip -q TREAU-source.zip -d .treau-import
          test -f .treau-import/TREAU/package.json
          test -f .treau-import/TREAU/app/page.tsx
          cp -a .treau-import/TREAU/. ./
          rm -rf .treau-import
          rm -f TREAU-source.zip 'TREAU-source (1).zip'
          # Do not republish licensed font binaries or platform-specific metadata.
          find public/fonts -maxdepth 1 -type f \( -name '*.woff2' -o -name '*.woff' -o -name '*.otf' -o -name '*.ttf' \) -delete 2>/dev/null || true
          rm -rf .openai
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish TREAU complete website files'
            git push origin HEAD:main
          fi
